<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurar contraseña</title>

    <link
        rel="stylesheet"
        href="../css/estilos2.css"
    >

    <script
        src="../js/restaurar-password.js"
        defer
    ></script>
</head>

<body>
    <header>
        <div class="marca">
            <img
                src="../img/pythonizadoLogo.png"
                alt="Logo de Pythonizado"
                class="logo"
            >

            <div>
                <p>Pythonizado</p>
                <h1>Restaurar contraseña</h1>
            </div>
        </div>

        <nav>
            <a style="margin-left: 20%; color: #55e6a5;"  href="encargado.html">
                Volver
            </a>

            <button id="boton-logout" type="button">
                Cerrar sesión
            </button>
        </nav>
    </header>

    <main>
        <section aria-labelledby="titulo-restaurar">
            <h2 id="titulo-restaurar">
                Nueva contraseña
            </h2>

            <p>
                Selecciona un usuario y establece una
                nueva contraseña.
            </p>

            <p
                id="mensaje-error"
                class="mensaje-error"
                role="alert"
                hidden
            ></p>

            <p
                id="mensaje-exito"
                class="mensaje-exito"
                hidden
            ></p>

            <form id="formulario-password">
                <div>
                    <label for="usuario">
                        Usuario
                    </label>

                    <select
                        id="usuario"
                        name="id_usuario"
                        required
                    >
                        <option value="">
                            Seleccione un usuario
                        </option>
                    </select>
                </div>

                <div>
                    <label for="nueva-password">
                        Nueva contraseña
                    </label>

                    <input
                        type="password"
                        id="nueva-password"
                        name="nueva_password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div>
                    <label for="confirmar-password">
                        Confirmar nueva contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar-password"
                        name="confirmar_password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit">
                    Restaurar contraseña
                </button>
            </form>
        </section>
    </main>

    <footer>
        <span>
            Desarrollado por
            <strong>Leandro Cabrera</strong>
        </span>
    </footer>
</body>
</html>

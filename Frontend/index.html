<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sistema institucional para el registro y seguimiento de tickets."
    >

    <title>Iniciar sesión | Sistema de Tickets</title>

    <link rel="stylesheet" href="css/estilos2.css">

    <script src="js/login.js" defer></script>  <!--el defer hace que el codigo js se cargue desde el inicio-->
   

</head>

<body>
    <main>
        <section >
            <header>
                
                <div class="marca">
                    <img
                        src="../img/pythonizadoLogo.png"
                        alt="Logo de Pythonizado"
                        class="logo"
                    >

                    <div>
                        <h1>Sistema de tickets</h1>
                        <p>Gestión de incidentes</p>
                    </div>
                </div>

            
                

                <h1 id="titulo-login">
                    Gestión de tickets
                </h1>

                
            </header>

            <form id="formulario-login">
                <div>
                    <br>
                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        maxlength="50"
                        autocomplete="username"
                        required
                    >
                </div>

                <div>
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p
                    id="mensaje-error"
                    role="alert"
                    hidden
                ></p>

                <button type="submit">
                    Iniciar sesión
                </button>
            </form>
            <p>
                    Ingresa con tu cuenta para registrar y consultar
                    incidentes.
                </p>
        </section>
    </main>

  <footer>
    <img
        src="../img/pythonizadoLogo.png"
        alt=""
    >

    <span>
        Desarrollado por
        <strong>Pythonizado</strong>
        · Programación y educación tecnológica
    </span>

    <a
        href="https://www.linkedin.com/"
        target="_blank"
        rel="noopener noreferrer"
    >
        Conocer más
    </a>
</footer>
</body>
</html>
